<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-магазин</title>
    <link rel="stylesheet" href="style.css?v=11">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <h1 id="page-title">Категории</h1>
            <div style="display: flex; gap: 8px;">
                <!-- Кнопка админки (появится только у админа) -->
                <div class="cart-icon hidden" id="admin-btn" style="background: #2C3E50; color: white;">⚙️</div>
                <div class="cart-icon" id="cart-icon">
                    🛒 <span id="cart-count">0</span>
                </div>
            </div>
        </div>
        <p>Привет, <span id="user-name">гость</span>! Что будем покупать?</p>
    </header>

    <!-- Экран 1: Категории -->
    <main id="categories-view">
        <div id="category-list" class="category-grid"></div>
    </main>

    <!-- Экран 2: Товары в категории -->
    <main id="products-view" class="hidden">
        <button id="back-to-categories" class="back-btn">← Назад</button>
        <div id="product-list"></div>
    </main>

    <!-- Модальное окно Корзины -->
    <div id="cart-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Корзина</h2>
                <button id="close-cart" class="close-btn">✖</button>
            </div>
            <div id="cart-items" class="cart-items-list"></div>
            <div id="cart-total-block" class="cart-total-block hidden">
                <span>Итого:</span>
                <span id="cart-total-price">0 ₽</span>
            </div>
        </div>
    </div>

    <!-- Модальное окно Оформления -->
    <div id="checkout-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Оформление</h2>
                <button id="close-checkout" class="close-btn">✖</button>
            </div>
            <form id="order-form" class="order-form">
                <div class="input-group">
                    <label>Ваше имя</label>
                    <input type="text" id="client-name" placeholder="Иван" required>
                </div>
                <div class="input-group">
                    <label>Номер телефона</label>
                    <input type="tel" id="client-phone" placeholder="+7 (999) 000-00-00" required>
                </div>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИН-ПАНЕЛИ -->
    <div id="admin-modal" class="hidden">
        <div class="modal-content" style="height: 90vh; background: #F4F6F8;">
            <div class="modal-header">
                <h2>Админ-панель</h2>
                <button id="close-admin" class="close-btn">✖</button>
            </div>
            
            <!-- Навигация по вкладкам -->
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="tab-stats">📊 Статистика</button>
                <button class="admin-tab" data-tab="tab-orders">📦 Заказы</button>
                <button class="admin-tab" data-tab="tab-products">👕 Товары</button>
                <button class="admin-tab" data-tab="tab-categories">📁 Категории</button>
            </div>

            <!-- Вкладка: Статистика -->
            <div id="tab-stats" class="admin-tab-content">
                <div class="stats-card">
                    <h3>Общая выручка</h3>
                    <p id="admin-total-revenue">0 ₽</p>
                </div>
                <div class="stats-card">
                    <h3>Всего заказов</h3>
                    <p id="admin-total-orders">0</p>
                </div>
            </div>

            <!-- Вкладка: Заказы -->
            <div id="tab-orders" class="admin-tab-content hidden">
                <div id="admin-orders-list"></div>
            </div>

            <!-- Вкладка: Товары -->
            <div id="tab-products" class="admin-tab-content hidden">
                <button id="btn-show-add-product" class="buy-btn" style="width: 100%; border-radius: 8px; margin-bottom: 15px; font-size: 16px; height: auto; padding: 12px;">+ Добавить товар</button>
                
                <form id="admin-add-product-form" class="hidden admin-form">
                    <!-- СКРЫТОЕ ПОЛЕ ДЛЯ ID (нужно для редактирования) -->
                    <input type="hidden" id="edit-prod-id" value="">
                    
                    <input type="text" id="new-prod-name" placeholder="Название" required class="admin-input">
                    <input type="number" id="new-prod-price" placeholder="Цена (₽)" required class="admin-input">
                    <input type="number" id="new-prod-discount" placeholder="Скидка (%)" value="0" min="0" max="99" class="admin-input">
                    <input type="text" id="new-prod-img" placeholder="Ссылка на фото (URL)" required class="admin-input">
                    <select id="new-prod-cat" class="admin-input" required></select>
                    <button type="submit" id="admin-save-btn" class="admin-btn-save">Сохранить</button>
                </form>

                <div id="admin-products-list"></div>
            </div>

            <!-- Вкладка: Категории -->
            <div id="tab-categories" class="admin-tab-content hidden">
                <form id="admin-add-category-form" class="admin-form" style="margin-bottom: 20px;">
                    <input type="text" id="new-cat-name" placeholder="Название (например, 🎁 Подарки)" required class="admin-input">
                    <button type="submit" class="admin-btn-save">Добавить категорию</button>
                </form>
                <div id="admin-categories-list"></div>
            </div>
        </div>
    </div>

    <!-- Версия обновлена до 11 -->
    <script src="app_new.js?v=2"></script>
</body>
</html>
