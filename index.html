<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-магазин</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Магазин</h1>
            <div class="cart-icon" id="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
        </div>
        <p>Привет, <span id="user-name">гость</span>!</p>
    </header>

    <main id="product-list">
        <!-- Товары будут добавлены через JavaScript -->
    </main>

    <!-- Модальное окно корзины -->
    <div id="cart-modal" class="hidden">
        <div class="cart-header">
            <h2>Ваша корзина</h2>
            <button id="close-cart" class="close-btn">✖</button>
        </div>
        <div id="cart-items"></div>
    </div>

    <!-- Модальное окно оформления заказа -->
    <div id="checkout-modal" class="hidden">
        <div class="cart-header">
            <h2>Оформление заказа</h2>
            <button id="close-checkout" class="close-btn">✖</button>
        </div>
        <form id="order-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
            <input type="text" id="client-name" placeholder="Ваше имя" required style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
            <input type="tel" id="client-phone" placeholder="Ваш телефон" required style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
