<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-магазин</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <h1 id="page-title">Категории</h1>
            <div class="cart-icon" id="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
        </div>
        <p>Привет, <span id="user-name">гость</span>! Что будем покупать?</p>
    </header>

    <main id="categories-view">
        <div id="category-list" class="category-grid"></div>
    </main>

    <main id="products-view" class="hidden">
        <button id="back-to-categories" class="back-btn">← Назад</button>
        <div id="product-list"></div>
    </main>

    <div id="cart-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Корзина</h2>
                <button id="close-cart" class="close-btn">✖</button>
            </div>
            <div id="cart-items" class="cart-items-list"></div>
            <div id="cart-total-block" class="cart-total-block hidden">
                <span>Итого:</span>
                <span id="cart-total-price">0 ₽</span>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Оформление</h2>
                <button id="close-checkout" class="close-btn">✖</button>
            </div>
            <form id="order-form" class="order-form">
                <div class="input-group">
                    <label>Ваше имя</label>
                    <input type="text" id="client-name" placeholder="Иван" required>
                </div>
                <div class="input-group">
                    <label>Номер телефона</label>
                    <input type="tel" id="client-phone" placeholder="+7 (999) 000-00-00" required>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
